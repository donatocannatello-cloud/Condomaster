name: Build Android APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
    inputs:
      server_url:
        description: >
          Optional: build a "dev shell" APK that loads a live server
          (e.g. http://127.0.0.1:5173 for a Vite dev server running
          on the same phone via Termux) instead of bundling dist/.
          Leave empty for a normal offline production APK. A dev-shell
          build is never published to the stable "latest" release.
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        env:
          CAP_SERVER_URL: ${{ github.event.inputs.server_url }}
        run: npx cap sync android

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: condomaster-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Rename APK for release
        if: ${{ github.event.inputs.server_url == '' }}
        run: cp android/app/build/outputs/apk/debug/app-debug.apk condomaster.apk

      - name: Publish to stable "latest" release
        if: ${{ github.event.inputs.server_url == '' }}
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest build
          allowUpdates: true
          replacesArtifacts: true
          artifacts: condomaster.apk
          body: |
            Build automatica da commit ${{ github.sha }} (run #${{ github.run_number }}).
            Link di download stabile, sempre lo stesso:
            https://github.com/${{ github.repository }}/releases/download/latest/condomaster.apk
